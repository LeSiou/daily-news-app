name: Daily News Automated Update (08h00)

on:
  schedule:
    # Runs every day at 06:00 UTC (08:00 AM French Time CEST / 07:00 AM CET)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Fetch Daily News Script
        run: python scripts/fetch_daily_news.py

      - name: Commit & Push News Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily news: $(date +'%Y-%m-%d')" && git push)
